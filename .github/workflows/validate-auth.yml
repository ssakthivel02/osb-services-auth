name: Validate Auth Baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate policy and RBAC configuration
        run: python3 scripts/validate_auth_baseline.py
      - name: Run negative security test cases
        run: python3 scripts/test_auth_security_cases.py
      - name: Reject committed secrets and private keys
        run: python3 scripts/scan_secrets.py
      - name: Verify required documentation
        run: |
          set -euo pipefail
          test -f SECURITY.md
          test -f docs/THREAT_MODEL.md
          test -f docs/AUTH_OPERATIONS_RUNBOOK.md
          test -f docs/adr/0001-token-and-session-security.md
          test -f docs/PRODUCTION_READINESS.md
          test -f docs/OBSERVABILITY.md
      - name: Compile Python validators
        run: python3 -m compileall -q scripts
